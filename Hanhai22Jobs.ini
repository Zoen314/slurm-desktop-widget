[Rainmeter]
Update=1000
DynamicWindowSize=1
BackgroundMode=2
SolidColor=30,30,30,220

; ── Read jobs.txt (updated by slurm_daemon.pyw) ────────────
[MeasureOutput]
Measure=Plugin
Plugin=WebParser
URL=file://#CURRENTPATH#jobs.txt
RegExp=(?siU)^(.*)$
StringIndex=1
UpdateRate=10
DecodeCharacterReference=0
FinishAction=[!UpdateMeter MeterText][!Redraw]

; ── Display ────────────────────────────────────────────────
[MeterText]
Meter=String
MeasureName=MeasureOutput
X=6
Y=4
FontFace=Consolas
FontSize=9
FontColor=238,238,238,255
AntiAlias=1
ClipString=0
Padding=8,6,8,6
DynamicVariables=1
